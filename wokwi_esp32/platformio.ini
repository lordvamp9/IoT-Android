[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
build_src_filter = +<*> -<.pio/>
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
    beegee-tokyo/DHT sensor library for ESPx@1.19
    madhephaestus/ESP32Servo@3.0.5
